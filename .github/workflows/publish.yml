name: Publish to npm

# Publishes when a version tag is pushed: `npm run release:tag` after `npm run release:bump`.
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored in this repository;
# npm also attaches a provenance attestation that links the package to this workflow run.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@latest

      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "conclave-ai@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::conclave-ai@${version} is already on npm; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.published == 'false'
        run: npm ci

      - name: Verify
        if: steps.version.outputs.published == 'false'
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:web

      # prepack cleans and rebuilds dist before packing.
      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then exit 0; fi
          awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md --verify-tag
