name: Installed package acceptance
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run eval:product
      - run: npm run eval:package
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          include-hidden-files: true
          path: |
            .conclave/package-evaluation.json
            .conclave/product-evaluation.json
